<style>
:root {
  --bg: #f6f3f2;
  --surface: #ffffff;
  --text: #1d1b1e;
  --muted: #6b6470;
  --line: #e7e1df;
  --accent: #b23a55;
  --accent-soft: #f6e3e8;
  --shadow: 0 1px 2px rgba(30, 20, 25, .05), 0 6px 20px rgba(30, 20, 25, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d;
    --surface: #1a2029;
    --text: #e9e6ea;
    --muted: #9a97a3;
    --line: #2a313c;
    --accent: #e0708a;
    --accent-soft: #3a2230;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hero {
  height: 132px;
  background:
    radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,.18) 0%, transparent 55%),
    linear-gradient(135deg, #7d2238 0%, #b23a55 45%, #d8738a 100%);
}
main {
  position: relative;
  max-width: 560px;
  margin: -56px auto 0;
  padding: 0 16px 56px;
}
.avatar {
  width: 96px; height: 96px;
  border-radius: 50%;
  border: 4px solid var(--bg);
  background: #2a2730;
  display: block;
  object-fit: cover;
}
h1 {
  margin: 14px 0 0;
  font-size: 28px; font-weight: 700; letter-spacing: .01em;
}
.bio { margin: 12px 0 28px; font-size: 15px; }
.section-label {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12px; font-weight: 500;
  letter-spacing: .14em;
}
ul { list-style: none; margin: 0 0 28px; padding: 0; display: grid; gap: 12px; }
a.card {
  display: grid;
  grid-template-columns: 44px 1fr 20px;
  gap: 14px;
  align-items: center;
  padding: 16px 16px 16px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
  transition: transform .15s ease, border-color .15s ease;
}
a.card:hover, a.card:focus-visible {
  transform: translateY(-1px);
  border-color: var(--accent);
  outline: none;
}
.icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid; place-items: center;
}
.icon svg { width: 22px; height: 22px; }
.name { font-weight: 700; font-size: 16px; }
.desc { color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.desc span[lang="ja"] { font-family: "Noto Sans JP", sans-serif; }
.arrow { color: var(--muted); }
.arrow svg { width: 18px; height: 18px; display: block; }
a.card:hover .arrow { color: var(--accent); }
footer {
  margin-top: 8px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
footer a { color: var(--muted); }
.hero { position: relative; }
.lang {
  position: absolute; top: 14px; right: 16px;
  padding: 6px 14px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 999px;
  background: rgba(20, 10, 15, .22);
  color: #fff;
  font: 500 13px/1.2 "Noto Sans JP", "Noto Sans TC", sans-serif;
  letter-spacing: .04em;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: background .15s ease;
}
.lang:hover, .lang:focus-visible { background: rgba(20, 10, 15, .42); outline: none; }
footer a:hover { color: var(--accent); }
</style>
</head>

<script>
(function () {
  var T = {
    zh: { bio: "學習中", sec_write: "寫作", sec_db: "資料庫", sec_game: "遊戲",
          d_life: "生活與遊戲筆記・ARK 馴服紀錄", d_108: "直播心得・學習筆記",
          d_towa: "常闇トワ様直播資料庫", n_ark: "ARK 全收集資料庫",
          d_ark: "今日要抓・地圖攻略・圖鑑進度", n_pano: "ARK 全景",
          d_pano: "地圖生物分布・攻略流程", toggle: "日本語", html: "zh-Hant" },
    ja: { bio: "勉強中", sec_write: "書きもの", sec_db: "データベース", sec_game: "ゲーム",
          d_life: "日々のメモ・ARK テイム記録", d_108: "配信の感想と学習メモ",
          d_towa: "常闇トワ様配信データベース", n_ark: "ARK 全収集データベース",
          d_ark: "今日の目標・マップ攻略・図鑑", n_pano: "ARK 全景図",
          d_pano: "マップ別の生物分布・攻略の流れ", toggle: "中文", html: "ja" }
  };
  function get() { try { return localStorage.getItem("pcl_lang"); } catch (e) { return null; } }
  function set(v) { try { localStorage.setItem("pcl_lang", v); } catch (e) {} }
  var lang = get();
  if (lang !== "zh" && lang !== "ja") {
    lang = /^ja/i.test(navigator.language || "") ? "ja" : "zh";
  }
  var btn = document.getElementById("lang-toggle");
  function apply() {
    var d = T[lang];
    document.documentElement.lang = d.html;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute("data-i18n");
      if (d[k]) els[i].textContent = d[k];
    }
    btn.textContent = d.toggle;
  }
  btn.addEventListener("click", function () {
    lang = lang === "zh" ? "ja" : "zh";
    set(lang);
    apply();
  });
  apply();
})();
</script>
